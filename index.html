<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>教師全班成果展示儀表板 - 香港小學五年級人文科</title>
  <meta name="description" content="香港小學五年級人文科《應對青春期的心理變化》教師全班成果展示儀表板，支援 Firebase 實時同步。" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            brandYellow: '#F1C40F',
            brandBlue: '#3498DB',
            brandPurple: '#9B59B6',
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone CDN (編譯 JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase Compat SDK (相容 CDN 模式，免 npm 打包) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F9F9FB;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-amber-200">
  <div id="root"></div>

  <!-- React 應用主程式碼 -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // 1. 初始化 Firebase (連接 class5c-34b4d 項目)
    const firebaseConfig = {
      apiKey: "AIzaSyCEyvKPDef4iXfFbtKlLqap_bl0KMhGqvA",
      authDomain: "class5c-34b4d.firebaseapp.com",
      projectId: "class5c-34b4d",
      storageBucket: "class5c-34b4d.firebasestorage.app",
      messagingSenderId: "450354025490",
      appId: "1:450354025490:web:a3229ba127ffd4bf6034cb",
      measurementId: "G-JSCNEEPS31"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const COLLECTION_NAME = 'lesson_5C';

    // 內嵌 SVG 圖標組件 (零外部依賴、秒速渲染)
    const Icons = {
      RotateCcw: () => (
        <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" />
        </svg>
      ),
      Trash2: () => (
        <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" />
        </svg>
      ),
      Filter: () => (
        <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
        </svg>
      ),
      ArrowUpDown: () => (
        <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="m21 16-4 4-4-4" /><path d="M17 20V4" /><path d="m3 8 4-4 4 4" /><path d="M7 4v16" />
        </svg>
      ),
      Users: () => (
        <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
      ),
      Radio: () => (
        <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="2" /><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14" />
        </svg>
      ),
      Maximize2: () => (
        <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="15 3 21 3 21 9" /><polyline points="9 21 3 21 3 15" /><line x1="21" y1="3" x2="14" y2="10" /><line x1="3" y1="21" x2="10" y2="14" />
        </svg>
      ),
      Quote: () => (
        <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z" /><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z" />
        </svg>
      ),
      ShieldCheck: () => (
        <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" /><path d="m9 12 2 2 4-4" />
        </svg>
      ),
      Clock: () => (
        <svg className="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" />
        </svg>
      ),
      X: () => (
        <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      ),
      AlertTriangle: () => (
        <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
      ),
      Lock: () => (
        <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      ),
      KeyRound: () => (
        <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z" /><circle cx="16.5" cy="7.5" r=".5" fill="currentColor" />
        </svg>
      ),
      Bot: () => (
        <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <rect width="18" height="12" x="3" y="6" rx="2" /><path d="M9 10h.01" /><path d="M15 10h.01" /><path d="M12 2v4" />
        </svg>
      ),
      User: () => (
        <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" />
        </svg>
      )
    };

    // 2. 清洗紀錄確認視窗組件 (密碼為 111，不顯示密碼字樣)
    const ClearConfirmModal = ({ isOpen, onClose, onConfirm }) => {
      const [password, setPassword] = useState('');
      const [error, setError] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);

      if (!isOpen) return null;

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError(null);
        if (!password.trim()) {
          setError('請輸入教師管理密碼');
          return;
        }
        setIsSubmitting(true);
        const result = await onConfirm(password);
        setIsSubmitting(false);

        if (result.success) {
          setPassword('');
          onClose();
        } else {
          setError(result.error || '密碼錯誤！請輸入正確的教師授權密碼。');
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-[24px] max-w-md w-full p-6 sm:p-7 shadow-2xl border border-slate-200">
            <div className="flex items-center justify-between mb-4">
              <div className="w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center">
                <Icons.Trash2 />
              </div>
              <button
                onClick={onClose}
                className="p-2 text-slate-400 hover:text-slate-700 rounded-xl hover:bg-slate-100 min-h-[44px] min-w-[44px] flex items-center justify-center cursor-pointer"
              >
                <Icons.X />
              </button>
            </div>

            <h3 className="text-xl font-black text-slate-900 mb-1">清洗全班挑戰紀錄</h3>

            <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl mb-4 text-xs font-bold text-rose-700 flex items-center gap-2">
              <Icons.AlertTriangle />
              <span>🚫 學生不得按清除鍵！此操作僅供授課教師重置課堂數據。</span>
            </div>

            <p className="text-sm text-slate-600 mb-4">
              重置後將清空 Firebase 雲端集合（{COLLECTION_NAME}）內所有小組對練對話與點評。請教師輸入管理授權密碼以確認執行：
            </p>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="relative">
                <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                  <Icons.KeyRound />
                </div>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  placeholder="請輸入教師管理密碼"
                  autoFocus
                  className="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-300 focus:border-rose-500 focus:ring-2 focus:ring-rose-200 outline-none text-base text-slate-900 font-mono tracking-widest"
                />
              </div>

              {error && (
                <div className="text-xs font-bold text-rose-600 p-2 bg-rose-50 rounded-lg">
                  {error}
                </div>
              )}

              <div className="flex items-center justify-end gap-3 pt-2">
                <button
                  type="button"
                  onClick={onClose}
                  disabled={isSubmitting}
                  className="px-4 py-2.5 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-100 min-h-[44px] cursor-pointer"
                >
                  取消
                </button>
                <button
                  type="submit"
                  disabled={isSubmitting}
                  className="px-5 py-2.5 rounded-xl text-sm font-bold bg-rose-600 hover:bg-rose-700 text-white shadow-xs min-h-[44px] flex items-center gap-2 cursor-pointer"
                >
                  <Icons.Lock />
                  <span>{isSubmitting ? '驗證中...' : '確認清洗紀錄'}</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    };

    // 3. 全螢幕投影視窗組件 (適合電子白板講評)
    const ProjectionModal = ({ record, onClose }) => {
      if (!record) return null;

      const isScenarioA = (record.scenario_type || '').includes('情境 A');
      const isScenarioB = (record.scenario_type || '').includes('情境 B');

      const badgeColor = isScenarioA
        ? 'bg-sky-100 text-[#3498DB] border-sky-300'
        : isScenarioB
        ? 'bg-purple-100 text-[#9B59B6] border-purple-300'
        : 'bg-amber-100 text-amber-800 border-amber-300';

      const formattedTime = new Date(record.timestamp || Date.now()).toLocaleTimeString('zh-HK', {
        hour: '2-digit',
        minute: '2-digit',
      });

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 sm:p-6 overflow-y-auto">
          <div className="bg-white rounded-[28px] max-w-4xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-200 flex flex-col">
            {/* 視窗頭部 */}
            <div className="p-6 sm:p-8 bg-gradient-to-r from-slate-50 via-sky-50/30 to-purple-50/30 border-b border-slate-200 flex items-center justify-between gap-4 sticky top-0 z-10 bg-white">
              <div className="flex items-center gap-3 sm:gap-4">
                <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-[#3498DB] to-[#9B59B6] text-white flex items-center justify-center font-black text-xl shadow-md">
                  <Icons.Users />
                </div>
                <div>
                  <div className="flex items-center gap-2 flex-wrap mb-1">
                    <span className={`text-xs font-black px-3 py-1 rounded-xl border ${badgeColor}`}>
                      {record.scenario_type}
                    </span>
                    <span className="text-xs text-slate-500 flex items-center gap-1">
                      <Icons.Clock />
                      提交時間：{formattedTime}
                    </span>
                  </div>
                  <h2 className="text-xl sm:text-2xl font-black text-slate-900">
                    組員：{(record.group_members || []).join('、')}
                  </h2>
                </div>
              </div>

              <button
                type="button"
                onClick={onClose}
                className="p-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-600 transition-colors min-h-[48px] min-w-[48px] flex items-center justify-center cursor-pointer"
                title="關閉"
              >
                <Icons.X />
              </button>
            </div>

            {/* 視窗內容 */}
            <div className="p-6 sm:p-8 space-y-6 flex-1">
              {/* AI 個人化點評 */}
              <div className="p-6 rounded-[22px] bg-gradient-to-br from-amber-50 via-white to-purple-50 border-2 border-amber-300 shadow-sm space-y-3">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-xl bg-amber-400 text-slate-900 flex items-center justify-center font-black">
                      <Icons.Quote />
                    </div>
                    <h3 className="text-base sm:text-lg font-black text-slate-900">
                      AI 挑戰員個人化點評（全班重點導讀）
                    </h3>
                  </div>
                  <span className="text-xs font-bold text-amber-800 bg-amber-100 px-3 py-1 rounded-lg">
                    約 50 字評析
                  </span>
                </div>

                <p className="text-lg sm:text-xl font-bold text-slate-800 leading-relaxed bg-white/90 p-4 rounded-xl border border-amber-200">
                  {record.ai_feedback}
                </p>

                {/* 3S 指標 */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
                  <div className="p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-sm font-bold flex items-center gap-2">
                    <Icons.ShieldCheck />
                    <span>Say NO: {record.evaluation?.say_no ? '態度果斷堅決' : '需增強堅決度'}</span>
                  </div>
                  <div className="p-3 rounded-xl bg-sky-50 border border-sky-200 text-sky-900 text-sm font-bold flex items-center gap-2">
                    <Icons.ShieldCheck />
                    <span>Safety: {record.evaluation?.safety ? '成功守護私隱' : '注意防範風險'}</span>
                  </div>
                  <div className="p-3 rounded-xl bg-purple-50 border border-purple-200 text-purple-900 text-sm font-bold flex items-center gap-2">
                    <Icons.ShieldCheck />
                    <span>Seek Help: {record.evaluation?.seek_help ? '懂得尋求師長協助' : '遇疑慮應向家長反映'}</span>
                  </div>
                </div>
              </div>

              {/* 逐句研讀 */}
              <div className="space-y-4">
                <h3 className="text-base font-black text-slate-900 flex items-center gap-2">
                  <span>完整對練逐句研讀</span>
                </h3>

                <div className="space-y-4">
                  {(record.dialogue_history || []).map((item, idx) => {
                    const isAI = item.speaker === 'AI 挑戰員';
                    return (
                      <div
                        key={idx}
                        className={`flex items-start gap-4 ${isAI ? 'justify-start' : 'justify-end'}`}
                      >
                        {isAI && (
                          <div className="w-12 h-12 rounded-2xl bg-slate-800 text-amber-400 flex items-center justify-center shrink-0 shadow-xs">
                            <Icons.Bot />
                          </div>
                        )}

                        <div
                          className={`max-w-[85%] rounded-[24px] p-5 text-base sm:text-lg leading-relaxed shadow-xs ${
                            isAI
                              ? 'bg-slate-100 text-slate-800 border border-slate-200 rounded-tl-sm'
                              : 'bg-gradient-to-r from-[#3498DB] to-[#2980B9] text-white rounded-tr-sm'
                          }`}
                        >
                          <div className="flex items-center gap-2 mb-1">
                            <span className={`text-xs font-black ${isAI ? 'text-slate-500' : 'text-sky-100'}`}>
                              {item.speaker === '學生' ? `學生小組 (${(record.group_members || []).join('、')})` : 'AI 挑戰員 (陌生網友)'}
                            </span>
                          </div>
                          <p className="whitespace-pre-wrap font-medium">{item.text}</p>
                        </div>

                        {!isAI && (
                          <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-[#3498DB] to-[#9B59B6] text-white flex items-center justify-center shrink-0 shadow-xs">
                            <Icons.User />
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* 視窗底部 */}
            <div className="p-6 bg-slate-50 border-t border-slate-200 flex items-center justify-between">
              <div className="text-xs text-slate-500">
                教室大螢幕白板專用投影模式 · 小學五年級人文科《應對青春期的心理變化》
              </div>
              <button
                type="button"
                onClick={onClose}
                className="px-6 py-3 rounded-xl font-bold text-sm bg-slate-800 hover:bg-slate-900 text-white transition-colors min-h-[48px] cursor-pointer"
              >
                關閉投影
              </button>
            </div>
          </div>
        </div>
      );
    };

    // 4. 學生組別卡片組件 (RecordCard)
    const RecordCard = ({ record, onOpenProjection }) => {
      const isScenarioA = (record.scenario_type || '').includes('情境 A');
      const isScenarioB = (record.scenario_type || '').includes('情境 B');

      const badgeTheme = isScenarioA
        ? 'bg-sky-50 text-[#3498DB] border-sky-200'
        : isScenarioB
        ? 'bg-purple-50 text-[#9B59B6] border-purple-200'
        : 'bg-amber-50 text-amber-700 border-amber-200';

      const avatarColor = isScenarioA
        ? 'bg-[#3498DB]'
        : isScenarioB
        ? 'bg-[#9B59B6]'
        : 'bg-[#F1C40F] text-slate-900';

      const formattedTime = new Date(record.timestamp || Date.now()).toLocaleTimeString('zh-HK', {
        hour: '2-digit',
        minute: '2-digit',
      });

      return (
        <div className="bg-white rounded-[24px] shadow-xs hover:shadow-md border border-slate-200/90 transition-all flex flex-col overflow-hidden group">
          {/* 卡片頂部 */}
          <div className="p-5 sm:p-6 border-b border-slate-100 flex items-start justify-between gap-3 bg-gradient-to-r from-slate-50/60 to-white">
            <div className="flex items-center gap-3">
              <div className={`w-11 h-11 rounded-2xl flex items-center justify-center font-black text-white text-base shadow-xs shrink-0 ${avatarColor}`}>
                {(record.group_members?.[0]?.[0]) || '組'}
              </div>
              <div>
                <div className="flex items-center gap-2 flex-wrap mb-1">
                  <span className={`text-xs font-black px-2.5 py-0.5 rounded-lg border ${badgeTheme}`}>
                    {record.scenario_type}
                  </span>
                  <span className="text-[11px] text-slate-400 flex items-center gap-1">
                    <Icons.Clock />
                    {formattedTime}
                  </span>
                </div>
                <h4 className="text-base sm:text-lg font-black text-slate-900 flex items-center gap-1.5">
                  <Icons.Users />
                  {(record.group_members || []).join('、')}
                </h4>
              </div>
            </div>

            <button
              type="button"
              onClick={() => onOpenProjection(record)}
              className="p-2 rounded-xl text-slate-400 hover:text-slate-800 hover:bg-slate-100 transition-colors shrink-0 min-h-[44px] min-w-[44px] flex items-center justify-center cursor-pointer"
              title="全螢幕大字體投影模式"
            >
              <Icons.Maximize2 />
            </button>
          </div>

          {/* 卡片主體 */}
          <div className="p-5 sm:p-6 space-y-4 flex-1 flex flex-col justify-between">
            <div className="space-y-3">
              <div className="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center justify-between">
                <span>社交對練紀錄</span>
                <span className="text-[11px] font-normal text-slate-400">
                  共 {(record.dialogue_history || []).length} 則對白
                </span>
              </div>

              <div className="space-y-2.5 max-h-[220px] overflow-y-auto pr-1">
                {(record.dialogue_history || []).map((dialogue, idx) => {
                  const isAI = dialogue.speaker === 'AI 挑戰員';
                  return (
                    <div
                      key={idx}
                      className={`p-3 rounded-2xl text-xs sm:text-sm font-medium leading-relaxed border ${
                        isAI
                          ? 'bg-slate-50 border-slate-200/80 text-slate-700'
                          : 'bg-sky-50/80 border-sky-200 text-sky-950 font-semibold'
                      }`}
                    >
                      <div className="flex items-center gap-1.5 text-[11px] mb-1">
                        <span className={`font-black ${isAI ? 'text-slate-500' : 'text-[#3498DB]'}`}>
                          {dialogue.speaker === '學生' ? '學生小組' : 'AI 挑戰員 (陌生網友)'}
                        </span>
                        <span className="text-slate-400">· 第 {idx + 1} 步</span>
                      </div>
                      <p className="whitespace-pre-wrap">{dialogue.text}</p>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* AI 點評 */}
            <div className="p-4 rounded-2xl bg-gradient-to-br from-amber-50/80 via-white to-purple-50/70 border border-amber-200/90 relative mt-2 shadow-2xs">
              <div className="flex items-center gap-1.5 text-xs font-black text-amber-900 mb-1.5">
                <Icons.Quote />
                <span>AI 個人化點評（3S 實踐與優化建議）：</span>
              </div>
              <p className="text-xs sm:text-sm font-semibold text-slate-800 leading-relaxed">
                {record.ai_feedback}
              </p>

              <div className="mt-2.5 flex items-center gap-2 flex-wrap text-[11px]">
                {record.evaluation?.say_no && (
                  <span className="px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800 font-bold">
                    ✓ Say NO
                  </span>
                )}
                {record.evaluation?.safety && (
                  <span className="px-2 py-0.5 rounded-md bg-sky-100 text-sky-800 font-bold">
                    ✓ Safety
                  </span>
                )}
                {record.evaluation?.seek_help && (
                  <span className="px-2 py-0.5 rounded-md bg-purple-100 text-purple-800 font-bold">
                    ✓ Seek Help
                  </span>
                )}
              </div>
            </div>
          </div>

          {/* 卡片底部操作 */}
          <div className="px-5 sm:px-6 py-4 bg-slate-50/90 border-t border-slate-100 flex items-center justify-between gap-3">
            <span className="text-xs font-semibold text-slate-400">
              社交對練紀錄
            </span>
            <button
              type="button"
              onClick={() => onOpenProjection(record)}
              className="text-xs sm:text-sm font-bold text-[#3498DB] hover:text-[#2980B9] flex items-center gap-1.5 px-3 py-2 rounded-xl hover:bg-sky-50 transition-colors min-h-[44px] cursor-pointer"
            >
              <Icons.ShieldCheck />
              <span>放大檢視詳情</span>
            </button>
          </div>
        </div>
      );
    };

    // 5. 教師全班成果展示儀表板主組件 (TeacherDashboard)
    const TeacherDashboard = () => {
      const [records, setRecords] = useState([]);
      const [isLoading, setIsLoading] = useState(false);
      const [autoRefresh, setAutoRefresh] = useState(true);
      const [selectedScenarioFilter, setSelectedScenarioFilter] = useState('ALL');
      const [sortOption, setSortOption] = useState('TIME_DESC');

      const [projectionRecord, setProjectionRecord] = useState(null);
      const [isClearModalOpen, setIsClearModalOpen] = useState(false);
      const [actionNotice, setActionNotice] = useState(null);

      // 手動自 Firebase 抓取
      const loadDataFromFirestore = async () => {
        setIsLoading(true);
        try {
          const snapshot = await db.collection(COLLECTION_NAME).orderBy('timestamp', 'desc').get();
          const list = [];
          snapshot.forEach((docSnap) => {
            list.push({ id: docSnap.id, ...docSnap.data() });
          });
          setRecords(list);
        } catch (err) {
          console.error('Firestore get error:', err);
        } finally {
          setIsLoading(false);
        }
      };

      // 監聽 Firebase Firestore 即時變更 (onSnapshot)
      useEffect(() => {
        setIsLoading(true);
        const unsubscribe = db.collection(COLLECTION_NAME)
          .orderBy('timestamp', 'desc')
          .onSnapshot(
            (snapshot) => {
              const list = [];
              snapshot.forEach((docSnap) => {
                list.push({ id: docSnap.id, ...docSnap.data() });
              });
              setRecords(list);
              setIsLoading(false);
            },
            (error) => {
              console.error('Firebase onSnapshot error:', error);
              setIsLoading(false);
            }
          );

        return () => unsubscribe();
      }, []);

      // 清空紀錄 (需密碼 111)
      const handleClearRecords = async (password) => {
        if (password !== '111') {
          return { success: false, error: '密碼錯誤！請輸入正確的教師授權密碼。' };
        }

        try {
          const snapshot = await db.collection(COLLECTION_NAME).get();
          const batch = db.batch();
          snapshot.docs.forEach((docSnap) => {
            batch.delete(docSnap.ref);
          });
          await batch.commit();

          setRecords([]);
          setProjectionRecord(null);
          setActionNotice('全班紀錄已成功清空！');
          setTimeout(() => setActionNotice(null), 3000);
          return { success: true };
        } catch (error) {
          console.error('Batch delete error:', error);
          return { success: false, error: '清除失敗：' + error.message };
        }
      };

      // 篩選與排序邏輯
      const filteredRecords = records.filter((r) => {
        if (selectedScenarioFilter === 'ALL') return true;
        if (selectedScenarioFilter === 'A') return (r.scenario_type || '').includes('情境 A');
        if (selectedScenarioFilter === 'B') return (r.scenario_type || '').includes('情境 B');
        if (selectedScenarioFilter === 'C') return (r.scenario_type || '').includes('情境 C');
        return true;
      });

      const sortedRecords = [...filteredRecords].sort((a, b) => {
        if (sortOption === 'TIME_DESC') return (b.timestamp || 0) - (a.timestamp || 0);
        if (sortOption === 'TIME_ASC') return (a.timestamp || 0) - (b.timestamp || 0);
        return 0;
      });

      // 統計計算
      const totalSubmissions = records.length;
      const countScenarioA = records.filter((r) => (r.scenario_type || '').includes('情境 A')).length;
      const countScenarioB = records.filter((r) => (r.scenario_type || '').includes('情境 B')).length;
      const countScenarioC = records.filter((r) => (r.scenario_type || '').includes('情境 C')).length;
      const sayNoPassed = records.filter((r) => r.evaluation?.say_no).length;
      const safetyPassed = records.filter((r) => r.evaluation?.safety).length;

      return (
        <div className="min-h-screen bg-[#F9F9FB] flex flex-col font-sans">
          {/* 頂部標題列 */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200/80 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-20">
                <div className="flex items-center gap-3">
                  <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-[#F1C40F] via-[#3498DB] to-[#9B59B6] p-0.5 flex items-center justify-center shadow-sm">
                    <div className="w-full h-full bg-white rounded-[14px] flex items-center justify-center">
                      <div className="text-[#3498DB]"><Icons.ShieldCheck /></div>
                    </div>
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold px-2 py-0.5 rounded-md bg-amber-100 text-amber-800 tracking-wide">
                        小五人文科
                      </span>
                      <span className="text-xs text-slate-500 hidden sm:inline">
                        《應對青春期的心理變化》
                      </span>
                    </div>
                    <h1 className="text-lg sm:text-xl font-extrabold text-slate-900 tracking-tight">
                      AI 網上社交挑戰員 · 教師成果儀表板
                    </h1>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-amber-50 text-amber-900 border border-amber-200">
                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                    Firebase 實時同步中 ({firebaseConfig.projectId} · {COLLECTION_NAME})
                  </span>
                </div>
              </div>
            </div>
          </header>

          {/* 主要工作區 */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-6">
            {actionNotice && (
              <div className="fixed top-24 right-6 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center gap-2 text-sm font-bold animate-bounce">
                <span>{actionNotice}</span>
              </div>
            )}

            {/* 控制概覽板 */}
            <div className="bg-white rounded-[24px] p-6 sm:p-8 shadow-xs border border-slate-200/80">
              <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-6 pb-6 border-b border-slate-100">
                <div>
                  <div className="flex items-center gap-2 mb-1.5 flex-wrap">
                    <span className="px-3 py-1 rounded-full text-xs font-black bg-purple-100 text-[#9B59B6]">
                      全班學習成果大螢幕
                    </span>
                    <span className="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full text-xs font-bold bg-amber-50 text-amber-800 border border-amber-200">
                      <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                      Firebase 實時同步中 ({firebaseConfig.projectId} · 集合: {COLLECTION_NAME})
                    </span>
                    <span className="text-xs text-slate-500">
                      香港小學五年級人文科《應對青春期的心理變化》
                    </span>
                  </div>
                  <h2 className="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">
                    教師全班成果展示儀表板
                  </h2>
                  <p className="text-sm text-slate-600 mt-1 max-w-2xl">
                    投影至電子白板引導全班反思：檢視各組學生在面對陌生網友時，能否堅定運用{' '}
                    <span className="font-bold text-[#3498DB]">Say NO</span> 及{' '}
                    <span className="font-bold text-[#9B59B6]">Safety</span> 守護個人私隱。
                  </p>
                </div>

                {/* 課堂快速統計 */}
                <div className="flex items-center gap-3 sm:gap-4 flex-wrap">
                  <div className="bg-sky-50 border border-sky-200/90 rounded-2xl px-4 py-3 text-center min-w-[96px]">
                    <div className="text-xs font-bold text-sky-800">已提交組數</div>
                    <div className="text-2xl font-black text-[#3498DB]">{totalSubmissions}</div>
                  </div>

                  <div className="bg-purple-50 border border-purple-200/90 rounded-2xl px-4 py-3 text-center min-w-[96px]">
                    <div className="text-xs font-bold text-purple-800">Say NO 實踐</div>
                    <div className="text-2xl font-black text-[#9B59B6]">{sayNoPassed} 組</div>
                  </div>

                  <div className="bg-amber-50 border border-amber-200/90 rounded-2xl px-4 py-3 text-center min-w-[96px]">
                    <div className="text-xs font-bold text-amber-800">Safety 守護</div>
                    <div className="text-2xl font-black text-amber-600">{safetyPassed} 組</div>
                  </div>
                </div>
              </div>

              {/* 篩選與功能按鈕列 */}
              <div className="mt-6 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4 flex-wrap">
                <div className="flex items-center gap-2.5 flex-wrap">
                  {/* 情境篩選 */}
                  <div className="flex items-center gap-1.5 bg-slate-100 p-1.5 rounded-2xl border border-slate-200">
                    <span className="text-xs font-bold text-slate-500 pl-2 hidden sm:inline flex items-center">
                      <Icons.Filter />
                      <span className="ml-1">情境：</span>
                    </span>
                    <button
                      type="button"
                      onClick={() => setSelectedScenarioFilter('ALL')}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all min-h-[38px] cursor-pointer ${
                        selectedScenarioFilter === 'ALL' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      顯示全部 ({records.length})
                    </button>
                    <button
                      type="button"
                      onClick={() => setSelectedScenarioFilter('A')}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all min-h-[38px] cursor-pointer ${
                        selectedScenarioFilter === 'A' ? 'bg-sky-500 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      情境 A（個人私隱）{countScenarioA > 0 ? `(${countScenarioA})` : ''}
                    </button>
                    <button
                      type="button"
                      onClick={() => setSelectedScenarioFilter('B')}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all min-h-[38px] cursor-pointer ${
                        selectedScenarioFilter === 'B' ? 'bg-purple-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      情境 B（人身安全）{countScenarioB > 0 ? `(${countScenarioB})` : ''}
                    </button>
                    <button
                      type="button"
                      onClick={() => setSelectedScenarioFilter('C')}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all min-h-[38px] cursor-pointer ${
                        selectedScenarioFilter === 'C' ? 'bg-amber-500 text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      情境 C（家庭財物）{countScenarioC > 0 ? `(${countScenarioC})` : ''}
                    </button>
                  </div>

                  {/* 排序 */}
                  <div className="flex items-center gap-1.5 bg-slate-100 p-1.5 rounded-2xl border border-slate-200">
                    <div className="text-slate-500 ml-2"><Icons.ArrowUpDown /></div>
                    <select
                      value={sortOption}
                      onChange={(e) => setSortOption(e.target.value)}
                      className="bg-transparent text-xs font-bold text-slate-700 outline-none pr-3 py-1.5 cursor-pointer"
                    >
                      <option value="TIME_DESC">按時間排序（最新）</option>
                      <option value="TIME_ASC">按時間排序（最早）</option>
                    </select>
                  </div>
                </div>

                {/* 右側操作鍵 */}
                <div className="flex items-center gap-3 self-end md:self-auto">
                  <button
                    type="button"
                    onClick={loadDataFromFirestore}
                    disabled={isLoading}
                    className="flex items-center gap-2 px-4 py-2.5 rounded-2xl bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 text-xs sm:text-sm font-bold shadow-2xs min-h-[44px] cursor-pointer active:scale-95"
                    title="立即手動更新成果"
                  >
                    <div className={isLoading ? 'animate-spin text-[#3498DB]' : ''}><Icons.RotateCcw /></div>
                    <span>實時刷新</span>
                  </button>

                  <div className="flex items-center gap-2 pl-2 border-l border-slate-200">
                    <button
                      type="button"
                      onClick={() => setIsClearModalOpen(true)}
                      className="flex items-center gap-2 px-3.5 py-2.5 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs sm:text-sm font-bold shadow-2xs min-h-[44px] cursor-pointer active:scale-95"
                      title="需要教師授權密碼方可清洗紀錄"
                    >
                      <Icons.Trash2 />
                      <span>清除紀錄</span>
                    </button>
                    <span className="text-xs font-bold text-rose-600 bg-rose-50/80 px-2.5 py-1.5 rounded-xl border border-rose-200/80 hidden sm:inline whitespace-nowrap">
                      🚫 學生不得按清除鍵
                    </span>
                  </div>
                </div>
              </div>
            </div>

            {/* 成果卡片網格展示 */}
            {sortedRecords.length === 0 ? (
              <div className="bg-white rounded-[24px] p-12 text-center border border-slate-200 shadow-xs space-y-4">
                <div className="w-16 h-16 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mx-auto">
                  <div className="w-8 h-8"><Icons.Users /></div>
                </div>
                <div>
                  <h3 className="text-lg font-black text-slate-800">
                    暫無學生小組提交紀錄
                  </h3>
                  <p className="text-sm text-slate-500 max-w-md mx-auto mt-1">
                    學生於 iPad 互動區完成「AI 社交挑戰員」對練後，成果將即時同步寫入 Firebase ({COLLECTION_NAME}) 並於此處展示。
                  </p>
                </div>
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {sortedRecords.map((record) => (
                  <RecordCard
                    key={record.id}
                    record={record}
                    onOpenProjection={(rec) => setProjectionRecord(rec)}
                  />
                ))}
              </div>
            )}

            {/* 全螢幕大字體投影模式 */}
            <ProjectionModal
              record={projectionRecord}
              onClose={() => setProjectionRecord(null)}
            />

            {/* 清洗紀錄密碼驗證視窗 */}
            <ClearConfirmModal
              isOpen={isClearModalOpen}
              onClose={() => setIsClearModalOpen(false)}
              onConfirm={handleClearRecords}
            />
          </main>

          {/* 頁腳 */}
          <footer className="mt-auto border-t border-slate-200/80 bg-white py-6">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-500">
              <div className="flex items-center gap-2 flex-wrap justify-center sm:justify-start">
                <span className="font-bold text-slate-700">香港小學五年級人文科</span>
                <span>·</span>
                <span>《應對青春期的心理變化》</span>
                <span>·</span>
                <span>《網上交友與自我保護 (3S: Say NO / Safety / Seek Help)》</span>
              </div>
              <div className="text-slate-400">
                適用於 iPad 觸控瀏覽與教室大螢幕投影 · 獨立單頁版
              </div>
            </div>
          </footer>
        </div>
      );
    };

    // 渲染至根節點
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TeacherDashboard />);
  </script>
</body>
</html>
