        if (selectedScenarioFilter === 'C') return (r.scenario_type || '').includes('情境 C');
        return true;
      });

      const sortedRecords = [...filteredRecords].sort((a, b) => {

              {/* 右側操作按鈕 */}

    // 清洗紀錄密碼彈窗組件
    const ClearConfirmModal = ({ isOpen, onClose, onConfirm }) => {
      const [pwd, setPwd] = useState('');
      const [err, setErr] = useState(null);
      const [submitting, setSubmitting] = useState(false);

      if (!isOpen) return null;

      const handleConfirm = async (e) => {
        e.preventDefault();
        setErr(null);
        if (!pwd.trim()) {
          setErr('請輸入教師管理密碼');
          return;
        }
        setSubmitting(true);
        const res = await onConfirm(pwd);
        setSubmitting(false);
        if (res.success) {
          onClose();
        } else {
          setErr(res.error || '密碼錯誤！請輸入正確的教師授權密碼。');
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-[24px] max-w-md w-full p-6 sm:p-7 shadow-2xl border border-slate-200">

            <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl mb-4 text-xs font-bold text-rose-700 flex items-center gap-2">
              <Icons.AlertTriangle />
              <span>🚫 學生不得按清除鍵！此操作僅供授課教師重置課堂數據。</span>
            </div>
            <p className="text-sm text-slate-600 mb-4">
              重置後將清空 Firebase 雲端集合（{COLLECTION_NAME}）內所有小組數據。請教師輸入管理授權密碼：
            </p>
            <form onSubmit={handleConfirm} className="space-y-4">
              <input
                type="password"
                value={pwd}
                onChange={(e) => setPwd(e.target.value)}
                placeholder="請輸入教師管理密碼"
                autoFocus
                className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-rose-500 focus:ring-2 focus:ring-rose-200 outline-none text-base font-mono tracking-widest"
              />
              {err && <div className="text-xs font-bold text-rose-600 p-2 bg-rose-50 rounded-lg">{err}</div>}
              <div className="flex items-center justify-end gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2.5 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-100 min-h-[44px] cursor-pointer"
                >
                  取消
                </button>
                <button
                  type="submit"
                  disabled={submitting}
                  className="px-5 py-2.5 rounded-xl text-sm font-bold bg-rose-600 hover:bg-rose-700 text-white min-h-[44px] cursor-pointer"
                >
                  {submitting ? '驗證中...' : '確認清洗紀錄'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    };

    // ==========================================
    // 7. 根應用程式 (包含頂部切換導覽列)
    // ==========================================
    const App = () => {
      const [currentView, setCurrentView] = useState('student'); // 預設開啟學生互動區，或隨時切換至教師板
      const [studentStep, setStudentStep] = useState('selector');
      const [selectedMembers, setSelectedMembers] = useState([]);
      const [challengeResult, setChallengeResult] = useState(null);

      const [records, setRecords] = useState([]);
      const [isLoadingRecords, setIsLoadingRecords] = useState(false);
      const [toastNotice, setToastNotice] = useState(null);

      // 監聽 Firebase Firestore
      useEffect(() => {
        setIsLoadingRecords(true);
        const unsubscribe = db.collection(COLLECTION_NAME)
          .orderBy('timestamp', 'desc')
          .onSnapshot(
            (snapshot) => {
              const list = [];
              snapshot.forEach((docSnap) => {
                list.push({ id: docSnap.id, ...docSnap.data() });
              });
              setRecords(list);
              setIsLoadingRecords(false);
            },
            (err) => {
              console.error('Firestore snapshot error:', err);
              setIsLoadingRecords(false);
            }
          );
        return () => unsubscribe();
      }, []);

      const handleToggleMember = (name) => {
        if (selectedMembers.includes(name)) {
          setSelectedMembers((prev) => prev.filter((n) => n !== name));
        } else {
          if (selectedMembers.length < 3) {
            setSelectedMembers((prev) => [...prev, name]);
          }
        }
      };

      const handleClearMembers = () => {
        setSelectedMembers([]);
      };

      const handleStartChallenge = () => {
        if (selectedMembers.length >= 2 && selectedMembers.length <= 3) {
          setStudentStep('chat');
        }
      };

      const handleChallengeCompleted = (result) => {
        setChallengeResult(result);
        setStudentStep('completed');
      };

      const handleRestartStudentChallenge = () => {
        setSelectedMembers([]);
        setChallengeResult(null);
        setStudentStep('selector');
      };

      const handleClearRecords = async (password) => {
        if (password !== '111') {
          return { success: false, error: '密碼錯誤！請輸入正確的教師授權密碼。' };
        }
        try {
          const snapshot = await db.collection(COLLECTION_NAME).get();
          const batch = db.batch();
          snapshot.docs.forEach((docSnap) => {
            batch.delete(docSnap.ref);
          });
          await batch.commit();
          setRecords([]);
          setToastNotice('全班紀錄已成功清空！');
          setTimeout(() => setToastNotice(null), 3000);
          return { success: true };
        } catch (e) {
          return { success: false, error: '清除失敗：' + e.message };
        }
      };

      const handleManualRefresh = async () => {
        setIsLoadingRecords(true);
        try {
          const snapshot = await db.collection(COLLECTION_NAME).orderBy('timestamp', 'desc').get();
          const list = [];
          snapshot.forEach((docSnap) => {
            list.push({ id: docSnap.id, ...docSnap.data() });
          });
          setRecords(list);
        } catch (e) {
          console.error(e);
        } finally {
          setIsLoadingRecords(false);
        }
      };

      return (
        <div className="min-h-screen bg-[#F9F9FB] flex flex-col font-sans">
          {/* Toast 通知 */}
          {toastNotice && (
            <div className="fixed top-24 right-6 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl text-sm font-bold animate-bounce">
              {toastNotice}
            </div>
          )}

          {/* 頂部切換導覽列 (支援 iPad 與 電子白板切換) */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200/80 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-20">
                <div className="flex items-center gap-3">
                  <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-[#F1C40F] via-[#3498DB] to-[#9B59B6] p-0.5 flex items-center justify-center shadow-sm">
                    <div className="w-full h-full bg-white rounded-[14px] flex items-center justify-center text-[#3498DB]">
                      <Icons.ShieldCheck />
                    </div>
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold px-2 py-0.5 rounded-md bg-amber-100 text-amber-800 tracking-wide">
                        小五人文科
                      </span>
                      <span className="text-xs text-slate-500 hidden sm:inline">
                        《應對青春期的心理變化》
                      </span>
                    </div>
                    <h1 className="text-lg sm:text-xl font-extrabold text-slate-900 tracking-tight flex items-center gap-1.5">
                      AI 網上社交挑戰員
                    </h1>
                  </div>
                </div>

                {/* 切換標籤：學生互動區 vs 教師成果板 */}
                <nav className="flex items-center gap-2 p-1.5 bg-slate-100/90 rounded-2xl border border-slate-200/60">
                  <button
                    type="button"
                    onClick={() => setCurrentView('student')}
                    className={`flex items-center gap-2 px-4 sm:px-5 py-2.5 rounded-xl text-sm sm:text-base font-bold transition-all min-h-[48px] touch-manipulation cursor-pointer ${
                      currentView === 'student'
                        ? 'bg-white text-slate-900 shadow-sm ring-1 ring-slate-900/5'
                        : 'text-slate-600 hover:text-slate-900 hover:bg-white/60'
                    }`}
                  >
                    <div className={currentView === 'student' ? 'text-[#3498DB]' : 'text-slate-400'}><Icons.Users /></div>
                    <span>📱 學生互動區</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setCurrentView('teacher')}
                    className={`flex items-center gap-2 px-4 sm:px-5 py-2.5 rounded-xl text-sm sm:text-base font-bold transition-all min-h-[48px] touch-manipulation cursor-pointer ${
                      currentView === 'teacher'
                        ? 'bg-white text-slate-900 shadow-sm ring-1 ring-slate-900/5'
                        : 'text-slate-600 hover:text-slate-900 hover:bg-white/60'
                    }`}
                  >
                    <div className={currentView === 'teacher' ? 'text-[#9B59B6]' : 'text-slate-400'}><Icons.MonitorPlay /></div>
                    <span>🖥️ 教師成果儀表板</span>
                    {records.length > 0 && (
                      <span className="ml-1 text-xs px-2 py-0.5 rounded-full bg-purple-100 text-[#9B59B6] font-bold">
                        {records.length}
                      </span>
                    )}
                  </button>
                </nav>
              </div>
            </div>
          </header>

          {/* 視圖內容渲染 */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
            {currentView === 'student' ? (
              <div>
                {studentStep === 'selector' && (
                  <GroupSelector
                    selectedMembers={selectedMembers}
                    onToggleMember={handleToggleMember}
                    onClearMembers={handleClearMembers}
                    onStartChallenge={handleStartChallenge}
                  />
                )}

                {studentStep === 'chat' && (
                  <ChallengeChat
                    groupMembers={selectedMembers}
                    onCompleted={handleChallengeCompleted}
                  />
                )}

                {studentStep === 'completed' && challengeResult && (
                  <ChallengeCompleted
                    groupMembers={selectedMembers}
                    scenario={challengeResult.scenario}
                    aiFeedback={challengeResult.aiFeedback}
                    evaluation={challengeResult.evaluation}
                    onGoToDashboard={() => setCurrentView('teacher')}
                    onRestart={handleRestartStudentChallenge}
                  />
                )}
              </div>
            ) : (
              <TeacherDashboardView
                records={records}
                isLoading={isLoadingRecords}
                onRefresh={handleManualRefresh}
                onClearRecords={handleClearRecords}
              />
            )}
          </main>

          {/* 頁腳 */}
          <footer className="mt-auto border-t border-slate-200/80 bg-white py-6">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-500">
              <div className="flex items-center gap-2 flex-wrap justify-center sm:justify-start">
                <span className="font-bold text-slate-700">香港小學五年級人文科</span>
                <span>·</span>
                <span>《應對青春期的心理變化》</span>
                <span>·</span>
                <span>《網上交友與自我保護 (3S: Say NO / Safety / Seek Help)》</span>
              </div>
              <div className="text-slate-400">
                適用於 iPad 學生操作與教室大螢幕投影
              </div>
            </div>
          </footer>
        </div>
      );
    };

    // 渲染至根節點
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
